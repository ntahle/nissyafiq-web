<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Letter For You</title>
<meta name="description" content="A little envelope, waiting to be opened.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='88'%3E%E2%9D%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Special+Elite&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
/* ============================================================
   PALETTE — sampled from the reference artwork
   ============================================================ */
:root{
  --cream:#FAF8F1;      /* stage ground (envelope scene) */
  --paper:#FFFCF6;      /* envelope paper                 */
  --cream-2:#F1ECE0;    /* envelope interior              */
  --burgundy:#7A2D28;   /* fold lines + type              */
  --ink:#4E1F1D;

  --seal-d:#6E1F21;
  --seal-m:#A43130;
  --seal-l:#C14945;

  --red:#E24140;        /* stage ground (letter scene)    */
  --pink:#F78FAF;       /* card                           */
  --pink-d:#EC7B9D;
  --blush:#F6DCD6;      /* inner letter panel             */
  --dec:#E63338;        /* border red                     */
  --dec-d:#B93034;
  --cream-w:#FFF0EC;    /* border white                   */
  --body-ink:#B94748;   /* small body copy                */

  --font-script:'Caveat','Segoe Script','Bradley Hand',cursive;
  --font-type:'Special Elite','Courier New',monospace;
  --font-serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --font-body:'Lora',Georgia,serif;

  /* ------------------------------------------------------------
     OPENING TIMELINE — one place to retune the whole sequence.
     Each phase begins only once the previous has finished, so no
     two things compete for the compositor at the same moment.
     ------------------------------------------------------------ */
  --t-seal:    200ms;   /* wax cracks                        */
  --t-flap:    660ms;   /* flap swings up (seal already gone) */
  --t-letter: 1380ms;   /* letter slides out (flap has landed) */
  --t-exit:   2200ms;   /* envelope leaves, red blooms in     */

  --dur-shake:  340ms;
  --dur-seal:   480ms;
  --dur-flap:   700ms;
  --dur-letter: 760ms;

  --ease-glide: cubic-bezier(.22,.85,.3,1);
  --ease-pop:   cubic-bezier(.34,1.28,.5,1);
  /* flap: prompt start, long settle — a pure ease-in-out leaves the
     first third of the swing looking like dead air */
  --ease-swing: cubic-bezier(.34,.06,.26,1);

  /* fallback only — fitEnvelope() replaces this with px so the
     envelope scene never needs scrolling */
  --env-w:min(80vw,420px,46svh);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* zero-size so it contributes no paint, but <use> can still reach it */
.sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ============================================================
   STAGE SHELL
   ============================================================ */
.stage{
  position:relative;
  height:100vh;
  height:100svh;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:var(--cream);
  transition:background-color 1.05s ease;
}
body.is-open .stage{background:var(--red)}

/* Fine paper grain as a small REPEATING tile. The previous version
   ran feTurbulence across the entire viewport (~1.3M px of CPU noise
   on a phone); this rasterises a 240px tile once and lets the
   compositor repeat it. No mix-blend-mode either — blending a
   full-screen layer forces a re-blend of the page every frame. */
.grain{
  position:fixed;inset:0;z-index:60;pointer-events:none;
  opacity:.05;
  background-repeat:repeat;
  background-size:240px 240px;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='240'%20height='240'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.8'%20numOctaves='4'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='240'%20height='240'%20filter='url(%23n)'/%3E%3C/svg%3E");
  transition:opacity 1s ease;
}
body.is-open .grain{opacity:.032}

/* Soft red bloom: small fixed raster + transform:scale, so the
   gradient is painted once instead of at 130vmax every frame. */
.bloom{
  position:absolute;z-index:1;pointer-events:none;
  left:50%;top:50%;
  width:560px;height:560px;margin:-280px 0 0 -280px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(226,65,64,.98) 0%,
    rgba(226,65,64,.62) 30%,
    rgba(226,65,64,0) 62%);
  opacity:0;
  transform:scale(.14);
  will-change:transform,opacity;
  transition:opacity .9s ease, transform 1.15s var(--ease-glide);
}
body.is-open .bloom{opacity:1;transform:scale(4.6)}

.hearts{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .7s ease}
body.is-open .hearts{opacity:0}
/* stand the ambient loops down while the opening plays: ten extra
   composited layers competing for the same frames buys nothing,
   and they are about to be faded out anyway */
body.is-opening .fheart,
body.is-opening .hint span{animation-play-state:paused}
.fheart{
  position:absolute;bottom:-12vh;
  color:var(--seal-m);opacity:0;
  animation:drift linear infinite;
  will-change:transform,opacity;
}
@keyframes drift{
  0%{opacity:0;transform:translate3d(0,0,0) rotate(0deg) scale(.7)}
  12%{opacity:.5}
  85%{opacity:.3}
  100%{opacity:0;transform:translate3d(var(--dx,20px),-118vh,0) rotate(var(--rot,220deg)) scale(1.05)}
}

/* two vignettes so the tone change cross-fades instead of snapping */
.stage::before,.stage::after{
  content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  transition:opacity 1.05s ease;
}
.stage::before{
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.10) 100%);
}
.stage::after{
  background:radial-gradient(ellipse at 50% 45%,transparent 46%,rgba(120,20,20,.30) 100%);
  opacity:0;
}
.is-open .stage::before{opacity:0}
.is-open .stage::after{opacity:1}

/* ============================================================
   SCENES
   ============================================================ */
.scene{position:relative;z-index:5;width:100%;padding:clamp(14px,3.2vh,34px) 16px}

.scene--envelope{
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(10px,2.3vh,26px);
  transition:opacity .55s ease, transform .75s var(--ease-glide);
}
/* no filter:blur — blurring an ancestor of a preserve-3d subtree
   forces it flat and stutters the exit */
body.is-open .scene--envelope{opacity:0;transform:scale(.94) translateY(-3vh);pointer-events:none}

.scene--letter{
  position:fixed;inset:0;
  display:grid;place-items:center;
  opacity:0;pointer-events:none;
  transition:opacity .75s ease;
}
body.is-open .scene--letter{opacity:1;pointer-events:auto}

/* ============================================================
   SCENE 1 — ENVELOPE
   ============================================================ */
/* the letter rises into this space, so the handwriting steps aside
   as soon as the envelope starts to open */
body.is-opening .script-top{opacity:0}

/* the entrance animation is on the spans, so the parent's opacity is
   free to transition out later */
.scene--envelope > :not(.script-top){opacity:0;animation:riseIn .8s var(--ease-glide) forwards}
.envelope-wrap{animation-delay:.35s !important}
.hint{animation-delay:.6s !important}
.signature{animation-delay:.8s !important}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.script-top{
  margin:0;text-align:center;
  font-family:var(--font-script);
  font-weight:600;
  font-size:clamp(28px,5.8vw,48px);
  line-height:1.16;
  color:var(--burgundy);
  text-shadow:0 1px 0 rgba(255,255,255,.55);
  transform:rotate(-1.1deg);
  opacity:1;
  transition:opacity .55s ease;
}
.script-top span{display:block;opacity:0;animation:riseIn .8s var(--ease-glide) forwards}
.script-top span:nth-child(1){animation-delay:.2s}
.script-top span:nth-child(2){animation-delay:.37s}
.script-top span:nth-child(3){animation-delay:.54s}

/* reserves room above the envelope for the flap to swing open */
.envelope-wrap{position:relative;display:grid;justify-items:center;padding-top:calc(var(--env-w) * .395)}

/* The idle bob lives HERE, on a plain 2D wrapper. On the element
   that owns `perspective` it re-projected the whole 3D subtree on
   every frame of a permanently running animation. */
.envelope-float{will-change:transform;animation:bob 5.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.35deg)}50%{transform:translateY(-9px) rotate(.35deg)}}
body.is-opening .envelope-float{animation:shake var(--dur-shake) cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-4px,1px) rotate(-.7deg)}
  42%{transform:translate(4px,-1px) rotate(.7deg)}
  64%{transform:translate(-3px,1px) rotate(-.45deg)}
  84%{transform:translate(2px,0) rotate(.3deg)}
}

/* Static: never animated, so the 3D projection stays stable. */
.envelope{
  position:relative;
  width:var(--env-w);
  aspect-ratio:400/230;
  perspective:1400px;
  transform-style:preserve-3d;
}

/* --- open z-order: flap(-6) < letter(-4) < back(0) < front(3) --- */
.env-back,.env-front{position:absolute;inset:0}
.env-back{transform:translateZ(0)}
.env-front{transform:translateZ(3px);pointer-events:none}
.env-back svg,.env-front svg{width:100%;height:100%;display:block}
.env-back svg{filter:drop-shadow(0 16px 24px rgba(90,40,30,.17))}
.env-front svg{filter:drop-shadow(0 10px 18px rgba(90,40,30,.14))}

.letter-sheet{
  position:absolute;left:7%;width:86%;top:6%;height:88%;
  transform:translateZ(-4px);
  transform-origin:50% 20%;
  border-radius:3px;
  background:linear-gradient(170deg,#F9A2BC 0%,var(--pink) 46%,var(--pink-d) 100%);
  box-shadow:0 10px 22px rgba(120,30,40,.22);
  display:grid;place-items:center;
  will-change:transform,opacity;
  transition:
    transform var(--dur-letter) var(--ease-glide) var(--t-letter),
    opacity .4s ease 120ms;
}
/* 6% + 88% = 94%, so the sheet stays inside the envelope. It used to be
   112% tall, which left ~43px of pink poking out below the bottom edge. */
body.is-opening .letter-sheet{transform:translateZ(-4px) translateY(-114%) rotate(-2.2deg)}
body.is-open .letter-sheet{opacity:0}
/* The beat animates the outermost <svg>, which the browser composites.
   On an inner <path> it repainted the whole svg every frame — right
   while the letter was sliding out in 3D. */
.ls-heart{width:40%;color:var(--dec);opacity:.9;overflow:visible;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}22%{transform:scale(1.13)}38%{transform:scale(.97)}}

/* Flap rotates to exactly 180deg on an ease with no overshoot. The
   previous overshoot curve pushed past 180deg, which swapped which
   face was front-facing and made the flap visibly flicker mid-swing.
   It ALSO translates down 115% of its own height (158 of the
   envelope's 230 units), so the fold-back finishes INSIDE the
   envelope's silhouette, hidden behind the back panel. Without that
   tuck the opened flap stayed standing above the top edge, and since
   it is 100% wide against the letter's 86%, its edges showed up as
   stray cream triangles down both sides of the letter and under its
   bottom. Both transform lists carry the same three functions so the
   browser interpolates them function-by-function, not as a matrix. */
.flap{
  position:absolute;left:0;width:100%;top:0;height:68.7%;
  transform-style:preserve-3d;
  transform-origin:50% 0%;
  transform:translateZ(5px) translateY(0%) rotateX(0deg);
  will-change:transform;
  transition:transform var(--dur-flap) var(--ease-swing) var(--t-flap);
  pointer-events:none;
}
body.is-opening .flap,body.is-open .flap{
  transform:translateZ(-6px) translateY(115%) rotateX(180deg);
}
.flap__face{position:absolute;inset:0;backface-visibility:hidden}
.flap__face svg{width:100%;height:100%;display:block}
/* no drop-shadow on the rotating face: a filter on a 3D-transformed
   element re-renders on every frame of the swing */
.flap__face--back{transform:rotateX(180deg)}

/* Soft shadow as its own static element. Previously this was
   filter:drop-shadow() on .seal, and because the seal pulse animated
   *inside* it the filter re-rendered on every frame, forever. */
.seal-shadow{
  position:absolute;left:50%;top:56%;
  width:27%;padding-top:23%;
  /* nudged down so it reads as a cast shadow, not a halo */
  transform:translate(-50%,-46%) translateZ(7px);
  border-radius:50%;
  background:radial-gradient(ellipse at 50% 70%,
    rgba(90,20,20,.50) 0%,
    rgba(90,20,20,.22) 46%,
    rgba(90,20,20,0) 72%);
  pointer-events:none;
}
.seal{
  position:absolute;left:50%;top:56%;
  width:23%;
  transform:translate(-50%,-50%) translateZ(8px);
  pointer-events:none;
}
.seal svg{width:100%;height:auto;display:block;overflow:visible}
/* one-shot only — the old infinite pulse forced a filter re-render
   on every frame of the whole page, including the opening */
body.is-opening .seal-idle{animation:sealPop 280ms var(--ease-pop) both}
@keyframes sealPop{0%{scale:1}50%{scale:1.12}100%{scale:1}}

/* the halves only part once the bulge has finished */
.seal__half{
  transition:
    transform var(--dur-seal) cubic-bezier(.3,.9,.35,1) var(--t-seal),
    opacity .3s ease calc(var(--t-seal) + 150ms);
}
body.is-opening .seal__half--l{transform:translate(-46%,26%) rotate(-24deg);opacity:0}
body.is-opening .seal__half--r{transform:translate(46%,22%) rotate(22deg);opacity:0}

.envelope-hit{
  position:absolute;top:-12%;left:-8%;width:116%;height:126%;
  z-index:12;
  background:none;border:0;padding:0;margin:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.envelope-hit:focus-visible{outline:none}
.env-focus{
  position:absolute;top:22%;left:8%;width:84%;height:74%;
  border-radius:6px;pointer-events:none;
  box-shadow:0 0 0 3px rgba(164,49,48,.6);
  opacity:0;transition:opacity .2s;
}
.envelope-hit:focus-visible ~ .env-focus{opacity:1}

.hint{
  margin:0;text-align:center;
  font-family:var(--font-type);
  font-size:clamp(10px,1.3vw,12.5px);
  letter-spacing:.34em;text-transform:uppercase;
  color:var(--burgundy);opacity:.72;
}
.hint span{display:inline-block;animation:hintPulse 2.4s ease-in-out infinite}
.hint::after{content:'↓';display:block;margin-top:6px;letter-spacing:0;font-size:15px;opacity:.7}
@keyframes hintPulse{0%,100%{opacity:.5;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
body.is-opening .hint,body.is-open .hint{opacity:0}

.signature{margin:0;text-align:center;line-height:1}
.signature__love{
  display:block;margin-bottom:.7em;
  font-family:var(--font-type);
  font-size:clamp(10px,1.5vw,13px);
  letter-spacing:.42em;text-indent:.42em;
  color:var(--burgundy);opacity:.8;
}
.signature__name{
  display:block;
  font-family:var(--font-type);
  font-size:clamp(18px,3.4vw,29px);
  letter-spacing:.3em;text-indent:.3em;
  color:var(--burgundy);
}

/* ============================================================
   SCENE 2 — THE LETTER CARD
   ============================================================ */
/* no filter:blur — the gradient is soft on its own, and a 900px
   blurred layer is expensive to rasterise on first paint */
.letter-halo{
  position:absolute;top:50%;left:50%;
  width:min(120vw,900px);aspect-ratio:1;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,180,195,.34) 0%,rgba(255,180,195,.14) 34%,transparent 66%);
  pointer-events:none;
}

.card{
  position:relative;
  width:min(90vw,420px,55svh);
  aspect-ratio:320/452;
  background:var(--pink);
  border-radius:2px;
  box-shadow:0 18px 38px rgba(120,25,35,.40), 0 3px 8px rgba(120,25,35,.24);
  container-type:inline-size;
  opacity:0;transform:translateY(18px);
  will-change:transform,opacity;
  transition:opacity .6s ease .2s, transform .7s var(--ease-glide) .2s;
}
/* The card now fades rather than scales: scaling an element that
   carries a large blurred box-shadow makes the browser re-rasterise
   the shadow as the scale changes. It also waits for the bloom to
   finish rasterising so two heavy paints don't land on one frame. */
body.is-open .card{opacity:1;transform:none}

/* ------------------------------------------------------------
   Decoration layers.
   Each band is its own <svg>, tightly cropped to the region it
   draws. Animating an outermost <svg> is composited by the browser,
   whereas animating children INSIDE one big svg repaints the whole
   svg canvas every frame — which is what made the reveal stutter.
   Cropping each layer also keeps the total texture memory well
   below that of one full-card svg.
   ------------------------------------------------------------ */
.decor-layer{
  position:absolute;left:0;width:100%;
  display:block;overflow:visible;
  transform-origin:center;
  opacity:0;transform:scale(.9);
  /* closing: quick, no stagger */
  transition:opacity .3s ease, transform .3s ease;
}
body.is-open .decor-layer{
  opacity:1;transform:none;
  transition:opacity .5s ease var(--d,0ms), transform .55s var(--ease-pop) var(--d,0ms);
}
.decor-top   {top:1.3274%;   height:10.1770%; --d:0ms}
.decor-bottom{top:88.0531%;  height:10.6195%; --d:90ms}
.decor-sides {top:30.5310%;  height:47.3451%; --d:180ms}

.card-panel{
  position:absolute;
  left:16.56%;top:16.37%;width:66.875%;height:67.04%;
  background:var(--blush);
  padding:5.6% 7.2% 4.4%;
  display:flex;flex-direction:column;
  overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(230,51,56,.35) transparent;
}
.card-panel::-webkit-scrollbar{width:5px}
.card-panel::-webkit-scrollbar-thumb{background:rgba(230,51,56,.3);border-radius:9px}

/* text reveals stagger on open but reset instantly on close */
.card-greeting{
  margin:0 0 .5em;flex:none;
  font-family:var(--font-serif);font-weight:900;
  font-size:19px;                         /* fallback */
  font-size:clamp(19px,7.1cqw,31px);      /* scales with card width */
  line-height:1.12;color:var(--dec);
  opacity:0;transform:translateY(10px);
  transition:opacity .25s ease, transform .25s ease;
}
body.is-open .card-greeting{
  opacity:1;transform:none;
  transition:opacity .6s ease .4s, transform .6s var(--ease-glide) .4s;
}

.card-body{
  font-size:12px;                         /* fallback */
  font-size:clamp(12px,3cqw,13.6px);      /* scales with card width */
  line-height:1.78;color:var(--body-ink);
}
.card-body p{margin:0 0 .95em}
.card-body p:last-child{margin-bottom:0}
.card-body p{
  opacity:0;transform:translateY(9px);
  transition:opacity .25s ease, transform .25s ease;
}
body.is-open .card-body p{
  opacity:1;transform:none;
  transition:opacity .6s ease, transform .6s var(--ease-glide);
  transition-delay:calc(var(--i,0) * 130ms + 560ms);
}

.card-sign{
  margin:auto 0 0;padding-top:1.1em;flex:none;
  text-align:right;
  font-family:var(--font-body);
  font-size:11px;
  font-size:clamp(10.5px,2.5cqw,12px);
  line-height:1.5;color:var(--body-ink);
  opacity:0;transform:translateY(9px);
  transition:opacity .25s ease, transform .25s ease;
}
body.is-open .card-sign{
  opacity:1;transform:none;
  transition:opacity .6s ease, transform .6s var(--ease-glide);
  transition-delay:calc(var(--i,3) * 130ms + 560ms);
}
.card-sign span{display:block}
.card-sign strong{
  display:block;margin-top:.18em;
  font-family:var(--font-serif);font-weight:700;
  font-size:clamp(13px,3.3cqw,15.5px);
  color:var(--dec);
}
.card-sign em{display:block;margin-top:.1em;font-style:italic;color:var(--dec)}

.replay{
  position:absolute;bottom:clamp(12px,3vh,26px);left:50%;
  transform:translateX(-50%);
  z-index:20;
  font-family:var(--font-type);
  font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--cream-w);
  background:rgba(255,240,236,.2);
  border:1px solid rgba(255,240,236,.55);
  border-radius:999px;padding:11px 22px;
  cursor:pointer;
  opacity:0;
  transition:opacity .3s ease, background .25s ease;
}
body.is-open .replay{opacity:1;transition:opacity .55s ease 1.2s, background .25s ease}
.replay:hover{background:rgba(255,240,236,.26)}
.replay:focus-visible{outline:2px solid var(--cream-w);outline-offset:3px}

/* Release every promoted layer once things have settled, so an idle
   page isn't holding compositor memory. */
body.is-settled .card,
body.is-settled .decor-layer,
body.is-settled .flap,
body.is-settled .letter-sheet,
body.is-settled .bloom,
body.is-settled .envelope-float{will-change:auto}

/* ============================================================
   PARTICLES
   ============================================================ */
.burst{position:fixed;inset:0;z-index:50;pointer-events:none;overflow:hidden}
.shard{
  position:absolute;display:block;
  will-change:transform,opacity;
  animation:fly 1.4s cubic-bezier(.15,.6,.4,1) forwards;
}
@keyframes fly{
  0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
  70%{opacity:1}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(.35)}
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:520px){
  .signature__name{letter-spacing:.24em;text-indent:.24em}
  .card-panel{padding:5.2% 6.4% 4%}
}

/* ============================================================
   REDUCED MOTION
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    transition-delay:0ms !important;
  }
}
</style>
</head>

<body>
<div class="burst" id="burst" aria-hidden="true"></div>

<!-- shared decoration shapes (zero-size, referenced by every layer) -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <path id="d-heart" d="M0 42C0 42-44 12-44-15c0-17 13-27 27-27 9 0 15 7 17 14 2-7 8-14 17-14 14 0 27 10 27 27 0 27-44 57-44 57Z"/>
    <path id="d-leaf" d="M-17 4C-7-8 9-12 17-6 11 8-5 12-17 4Z"/>
    <g id="d-rosette">
      <g fill="var(--dec)">
        <ellipse cx="0" cy="-10" rx="5.5" ry="10"/>
        <ellipse cx="0" cy="-10" rx="5.5" ry="10" transform="rotate(60)"/>
        <ellipse cx="0" cy="-10" rx="5.5" ry="10" transform="rotate(120)"/>
        <ellipse cx="0" cy="-10" rx="5.5" ry="10" transform="rotate(180)"/>
        <ellipse cx="0" cy="-10" rx="5.5" ry="10" transform="rotate(240)"/>
        <ellipse cx="0" cy="-10" rx="5.5" ry="10" transform="rotate(300)"/>
      </g>
      <circle r="5" fill="var(--cream-w)"/>
      <circle r="2" fill="var(--dec-d)"/>
    </g>
    <g id="d-sprig">
      <path d="M-11 14C-7 6-2 1 5-3" fill="none" stroke="var(--cream-w)" stroke-width="2.2" stroke-linecap="round"/>
      <use href="#d-leaf" fill="var(--cream-w)" transform="translate(-8 9) rotate(30) scale(.36)"/>
      <use href="#d-leaf" fill="var(--cream-w)" transform="translate(-3 4) rotate(30) scale(.3)"/>
      <circle cx="6" cy="-4" r="2.8" fill="var(--cream-w)"/>
    </g>
    <path id="d-star" fill="var(--dec)" d="M0-13 3.2-3.2 13 0 3.2 3.2 0 13-3.2 3.2-13 0-3.2-3.2Z"/>
    <g id="d-dots" fill="var(--cream-w)">
      <circle r="2.3"/><circle cx="7" cy="-4.5" r="1.7"/>
      <circle cx="6" cy="5" r="1.5"/><circle cx="-6" cy="3" r="1.3"/>
    </g>
    <path id="d-spark" fill="var(--cream-w)" d="M0-7 1.7-1.7 7 0 1.7 1.7 0 7-1.7 1.7-7 0-1.7-1.7Z"/>
    <!-- arms point +x and +y from the origin -->
    <g id="d-corner">
      <path d="M0 26C0 10 8 2 24 0" fill="none" stroke="var(--cream-w)" stroke-width="3.2" stroke-linecap="round"/>
      <path fill="var(--cream-w)" d="M20-3c7 2 10 9 8 16-7 0-13-6-14-12z"/>
      <path fill="var(--cream-w)" d="M-3 18c3-7 10-10 17-8 0 8-6 14-12 15z"/>
      <circle cx="6" cy="6" r="2.6" fill="var(--cream-w)"/>
      <circle cx="22" cy="24" r="2" fill="var(--cream-w)"/>
    </g>
  </defs>
</svg>

<div class="grain" aria-hidden="true"></div>

<main class="stage" id="stage">

  <div class="bloom" aria-hidden="true"></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <!-- ================= SCENE 1 : ENVELOPE ================= -->
  <section class="scene scene--envelope" id="sceneEnvelope">

    <p class="script-top">
      <span>the love you</span>
      <span>gave was never</span>
      <span>a waste.</span>
    </p>

    <div class="envelope-wrap">

      <div class="envelope-float">
        <div class="envelope" id="envelope">

          <!-- back -->
          <div class="env-back" aria-hidden="true">
            <svg viewBox="0 0 400 230" fill="none">
              <rect x="1" y="1" width="398" height="228" rx="5" fill="var(--paper)"/>
              <rect x="1" y="1" width="398" height="228" rx="5" stroke="var(--burgundy)" stroke-width="1.4" opacity=".85"/>
              <path d="M1 1 L200 118 L399 1" stroke="var(--burgundy)" stroke-width="1.2" opacity=".35"/>
              <path d="M1 229 L200 118 L399 229" stroke="var(--burgundy)" stroke-width="1.2" opacity=".2"/>
            </svg>
          </div>

          <!-- letter, tucked inside (behind the back panel) -->
          <div class="letter-sheet" aria-hidden="true">
            <svg class="ls-heart" viewBox="-44 -42 88 84" fill="currentColor">
              <path d="M0 42C0 42-44 12-44-15c0-17 13-27 27-27 9 0 15 7 17 14 2-7 8-14 17-14 14 0 27 10 27 27 0 27-44 57-44 57Z"/>
            </svg>
          </div>

          <!-- front pocket -->
          <div class="env-front" aria-hidden="true">
            <svg viewBox="0 0 400 230" fill="none">
              <path d="M0 230 V88 L200 158 L400 88 V230 Z" fill="var(--paper)"/>
              <path d="M0 230 V88 L200 158 L400 88 V230 Z" stroke="var(--burgundy)" stroke-width="1.4" opacity=".85"/>
              <path d="M0 230 L200 158 L400 230" stroke="var(--burgundy)" stroke-width="1.2" opacity=".5"/>
            </svg>
          </div>

          <!-- flap (two-sided) -->
          <div class="flap" aria-hidden="true">
            <div class="flap__face flap__face--front">
              <svg viewBox="0 0 400 158" fill="none">
                <path d="M0 0 H400 L200 158 Z" fill="var(--paper)"/>
                <path d="M0 0 H400 L200 158 Z" stroke="var(--burgundy)" stroke-width="1.4" opacity=".85"/>
              </svg>
            </div>
            <div class="flap__face flap__face--back">
              <svg viewBox="0 0 400 158" fill="none">
                <path d="M0 0 H400 L200 158 Z" fill="var(--cream-2)"/>
                <path d="M0 0 H400 L200 158 Z" stroke="var(--burgundy)" stroke-width="1.4" opacity=".55"/>
                <path d="M22 10 L200 148 L378 10" stroke="var(--burgundy)" stroke-width="1.1" opacity=".22"/>
              </svg>
            </div>
          </div>

          <!-- wax seal -->
          <div class="seal-shadow" aria-hidden="true"></div>
          <div class="seal" id="seal" aria-hidden="true">
            <div class="seal-idle">
              <svg viewBox="-56 -54 112 108">
                <defs>
                  <radialGradient id="waxG" cx="36%" cy="30%" r="74%">
                    <stop offset="0%" stop-color="#CE5350"/>
                    <stop offset="42%" stop-color="var(--seal-m)"/>
                    <stop offset="100%" stop-color="var(--seal-d)"/>
                  </radialGradient>
                  <clipPath id="halfL"><rect x="-56" y="-54" width="56" height="108"/></clipPath>
                  <clipPath id="halfR"><rect x="0" y="-54" width="56" height="108"/></clipPath>
                  <g id="wax">
                    <path d="M0 44C0 44-46 13-46-16c0-18 14-28 28-28 9.5 0 16 7.5 18 15 2-7.5 8.5-15 18-15 14 0 28 10 28 28 0 29-46 60-46 60Z" fill="url(#waxG)"/>
                    <path d="M0 33C0 33-35 8-35-13c0-13 10-20 21-20 7 0 12 5.5 13.5 11 1.5-5.5 6.5-11 13.5-11 11 0 21 7 21 20 0 21-35 46-35 46Z" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2.4"/>
                    <ellipse cx="-15" cy="-22" rx="11" ry="7.5" fill="rgba(255,255,255,.28)" transform="rotate(-28 -15 -22)"/>
                  </g>
                </defs>
                <g clip-path="url(#halfL)"><g class="seal__half seal__half--l"><use href="#wax"/></g></g>
                <g clip-path="url(#halfR)"><g class="seal__half seal__half--r"><use href="#wax"/></g></g>
              </svg>
            </div>
          </div>

        </div>
      </div>

      <button class="envelope-hit" id="openBtn" aria-label="Open the love letter">
        <span class="sr-only">Open the letter</span>
      </button>
      <span class="env-focus" aria-hidden="true"></span>
    </div>

    <p class="hint" id="hint"><span>tap to open</span></p>

    <p class="signature">
      <span class="signature__love">LOVE ,</span>
      <span class="signature__name">OLIVIA</span>
    </p>

  </section>

  <!-- ================= SCENE 2 : THE LETTER ================= -->
  <section class="scene scene--letter" id="sceneLetter" aria-label="Your love letter">
    <div class="letter-halo" aria-hidden="true"></div>

    <div class="card" id="card">

      <!-- top band: corner flourishes + valentine garland.
           viewBox y 6..52 of the 320x452 card -->
      <svg class="decor-layer decor-top" viewBox="0 6 320 46" preserveAspectRatio="none" aria-hidden="true">
        <g transform="translate(18 20) scale(.85)"><use href="#d-corner"/></g>
        <g transform="translate(302 20) rotate(90) scale(.85)"><use href="#d-corner"/></g>
        <g transform="translate(54 26)"><use href="#d-spark"/></g>
        <g transform="translate(72 32) scale(.9)"><use href="#d-dots"/></g>
        <g transform="translate(94 35) rotate(-40) scale(.78)"><use href="#d-sprig"/></g>
        <g transform="translate(114 32) scale(.82)"><use href="#d-rosette"/></g>
        <g transform="translate(134 27) scale(.2)"><use href="#d-heart" fill="var(--dec)"/></g>
        <g transform="translate(160 30) scale(.38)"><use href="#d-heart" fill="var(--dec-d)"/></g>
        <g transform="translate(186 27) scale(.2)"><use href="#d-heart" fill="var(--dec)"/></g>
        <g transform="translate(206 32) scale(.82)"><use href="#d-rosette"/></g>
        <g transform="translate(226 35) rotate(40) scale(.78)"><use href="#d-sprig"/></g>
        <g transform="translate(248 32) scale(.9)"><use href="#d-dots"/></g>
        <g transform="translate(266 26)"><use href="#d-spark"/></g>
      </svg>

      <!-- bottom band: viewBox y 398..446 -->
      <svg class="decor-layer decor-bottom" viewBox="0 398 320 48" preserveAspectRatio="none" aria-hidden="true">
        <g transform="translate(18 432) rotate(-90) scale(.85)"><use href="#d-corner"/></g>
        <g transform="translate(302 432) rotate(180) scale(.85)"><use href="#d-corner"/></g>
        <g transform="translate(68 420) scale(.85)"><use href="#d-dots"/></g>
        <g transform="translate(90 416) rotate(40) scale(.74)"><use href="#d-sprig"/></g>
        <g transform="translate(112 420) scale(.8)"><use href="#d-rosette"/></g>
        <g transform="translate(134 418) scale(.22)"><use href="#d-heart" fill="var(--dec)"/></g>
        <g transform="translate(160 421) scale(.42)"><use href="#d-heart" fill="var(--dec-d)"/></g>
        <g transform="translate(186 418) scale(.22)"><use href="#d-heart" fill="var(--dec)"/></g>
        <g transform="translate(208 420) scale(.8)"><use href="#d-rosette"/></g>
        <g transform="translate(230 416) rotate(-40) scale(.74)"><use href="#d-sprig"/></g>
        <g transform="translate(252 420) scale(.85)"><use href="#d-dots"/></g>
      </svg>

      <!-- side borders: viewBox y 138..352 -->
      <svg class="decor-layer decor-sides" viewBox="0 138 320 214" preserveAspectRatio="none" aria-hidden="true">
        <g transform="translate(18 152) scale(.68)"><use href="#d-star"/></g>
        <g transform="translate(18 188) rotate(-25) scale(.78)"><use href="#d-sprig"/></g>
        <g transform="translate(18 224) scale(.28)"><use href="#d-heart" fill="var(--dec)"/></g>
        <g transform="translate(18 262) scale(.9)"><use href="#d-dots"/></g>
        <g transform="translate(18 298) rotate(30) scale(.78)"><use href="#d-sprig"/></g>
        <g transform="translate(18 336) scale(.68)"><use href="#d-star"/></g>
        <g transform="translate(302 152) scale(.68)"><use href="#d-star"/></g>
        <g transform="translate(302 188) rotate(25) scale(.78)"><use href="#d-sprig"/></g>
        <g transform="translate(302 224) scale(.28)"><use href="#d-heart" fill="var(--dec)"/></g>
        <g transform="translate(302 262) scale(.9)"><use href="#d-dots"/></g>
        <g transform="translate(302 298) rotate(-30) scale(.78)"><use href="#d-sprig"/></g>
        <g transform="translate(302 336) scale(.68)"><use href="#d-star"/></g>
      </svg>

      <div class="card-panel" id="cardPanel">
        <h1 class="card-greeting" id="greeting">Dear Love,</h1>
        <div class="card-body" id="body"></div>
        <p class="card-sign" id="sign">
          <span id="closing">Forever yours,</span>
          <strong id="name">Henry</strong>
          <em id="kiss">xx</em>
        </p>
      </div>

    </div>

    <button class="replay" id="replay">Close &amp; read again</button>
  </section>

</main>

<script>
(function(){
  'use strict';

  /* ==========================================================
     ▼▼▼  YOUR LETTER GOES HERE  ▼▼▼
     Edit anything below. Plain text — apostrophes are fine.
     ========================================================== */
  const LETTER = {
    greeting: 'Dear Love,',
    paragraphs: [
      'Somewhere between your first hello and tonight, my whole life quietly rearranged itself around you. I did not notice it happening, and then one day I looked up and realised every good thing in my day had your name written somewhere inside it.',
      'You are the calm in my loudest days and the laugh in my quietest ones. You make an ordinary Tuesday feel like something worth remembering, and you make me feel like I am exactly where I am supposed to be.',
      'So here is a whole envelope for one small feeling: I would choose you again. Every time. Without hesitating even once.'
    ],
    closing: 'Forever yours,',
    name: 'Henry',
    kiss: 'xx'
  };
  /* ▲▲▲  END OF YOUR LETTER  ▲▲▲ */

  const root     = document.body;
  const stage    = document.getElementById('stage');
  const scene    = document.getElementById('sceneEnvelope');
  const env      = document.getElementById('envelope');
  const openBtn  = document.getElementById('openBtn');
  const seal     = document.getElementById('seal');
  const replay   = document.getElementById('replay');
  const burstBox = document.getElementById('burst');
  const heartBox = document.getElementById('hearts');
  const hint     = document.getElementById('hint');

  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SVGNS   = 'http://www.w3.org/2000/svg';
  const HEART   = 'M0 42C0 42-44 12-44-15c0-17 13-27 27-27 9 0 15 7 17 14 2-7 8-14 17-14 14 0 27 10 27 27 0 27-44 57-44 57Z';

  /* envelope geometry: height/width, and the flap reserve above it */
  const ENV_H   = 230 / 400;
  const RESERVE = 158 / 400;
  const BLOCK   = RESERVE + ENV_H;

  let state = 'closed';
  let rafFit = 0;

  /* ==========================================================
     Keep the envelope scene inside the viewport, always.
     The envelope is the only elastic part: measure everything
     else, then hand the remainder to the envelope width.
     ========================================================== */
  function fitEnvelope(){
    const vw = window.innerWidth;
    const narrow = vw <= 520;
    const ideal = Math.min(vw * (narrow ? 0.86 : 0.80), narrow ? 350 : 420);

    document.documentElement.style.setProperty('--env-w', ideal + 'px');

    // never re-flow the envelope while the letter is on screen
    if (root.classList.contains('is-open')) return;

    const envW = env.getBoundingClientRect().width;
    if (!envW) return;

    const total  = scene.scrollHeight;
    const chrome = total - envW * BLOCK;   // text, gaps, padding, signature
    const avail  = stage.clientHeight;

    if (total <= avail) return;            // already fits

    const next = (avail - chrome) / BLOCK;
    if (next > 0 && next < ideal){
      document.documentElement.style.setProperty('--env-w', Math.max(180, next - 1).toFixed(1) + 'px');
    }
  }

  function scheduleFit(){
    if (rafFit) cancelAnimationFrame(rafFit);
    rafFit = requestAnimationFrame(() => { rafFit = 0; fitEnvelope(); });
  }

  window.addEventListener('resize', scheduleFit, { passive: true });
  window.addEventListener('orientationchange', scheduleFit, { passive: true });

  /* ==========================================================
     Render the letter
     ========================================================== */
  const esc = s => String(s).replace(/[&<>"]/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  (function renderLetter(){
    document.getElementById('greeting').textContent = LETTER.greeting;
    document.getElementById('body').innerHTML = LETTER.paragraphs
      .map((p, i) => '<p style="--i:' + i + '">' + esc(p) + '</p>').join('');
    document.getElementById('closing').textContent = LETTER.closing;
    document.getElementById('name').textContent    = LETTER.name;
    document.getElementById('kiss').textContent    = LETTER.kiss;
    document.getElementById('sign').style.setProperty('--i', LETTER.paragraphs.length);
  })();

  /* ==========================================================
     Ambient floating hearts
     ========================================================== */
  (function makeHearts(n){
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++){
      const s = document.createElementNS(SVGNS, 'svg');
      s.setAttribute('viewBox', '-44 -42 88 84');
      s.setAttribute('class', 'fheart');
      const size = 10 + Math.random() * 22;
      s.style.left   = (Math.random() * 96) + 'vw';
      s.style.width  = size + 'px';
      s.style.height = size + 'px';
      s.style.setProperty('--dx',  (Math.random() * 80 - 40) + 'px');
      s.style.setProperty('--rot', (Math.random() * 420 - 210) + 'deg');
      s.style.animationDuration = (13 + Math.random() * 16) + 's';
      s.style.animationDelay = (-Math.random() * 24) + 's';
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', HEART);
      p.setAttribute('fill', 'currentColor');
      s.appendChild(p);
      frag.appendChild(s);
    }
    heartBox.appendChild(frag);
  })(10);

  /* ==========================================================
     Wax shatter
     ========================================================== */
  function shatter(){
    const r  = seal.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top  + r.height / 2;
    const colors = ['#A43130', '#B83A37', '#7A2425', '#C14945'];
    const frag = document.createDocumentFragment();

    for (let i = 0; i < 20; i++){
      const s = document.createElementNS(SVGNS, 'svg');
      s.setAttribute('viewBox', '-44 -42 88 84');
      s.setAttribute('class', 'shard');
      const size = 7 + Math.random() * 15;
      const ang  = Math.random() * Math.PI * 2;
      const dist = 90 + Math.random() * 280;
      s.style.width  = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (cx - size / 2) + 'px';
      s.style.top  = (cy - size / 2) + 'px';
      s.style.color = colors[i % colors.length];
      s.style.setProperty('--tx', (Math.cos(ang) * dist) + 'px');
      s.style.setProperty('--ty', (Math.sin(ang) * dist - 90) + 'px');
      s.style.setProperty('--r',  (Math.random() * 720 - 360) + 'deg');
      s.style.animationDelay = (Math.random() * 0.1) + 's';
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', HEART);
      p.setAttribute('fill', 'currentColor');
      s.appendChild(p);
      frag.appendChild(s);
    }
    burstBox.appendChild(frag);
    setTimeout(() => { burstBox.innerHTML = ''; }, 2300);
  }

  /* ==========================================================
     Open / close
     ========================================================== */
  function msVar(name, fallback){
    const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
    return Number.isFinite(v) ? v : fallback;
  }

  function open(){
    if (state !== 'closed') return;
    state = 'opening';
    root.classList.add('is-opening');
    seal.classList.add('is-breaking');

    if (reduced){
      root.classList.add('is-open');
      state = 'open';
      return;
    }

    shatter();

    // is-open lands only after the letter has finished sliding out
    setTimeout(() => {
      root.classList.add('is-open');
      state = 'open';
      const panel = document.getElementById('cardPanel');
      if (panel) panel.scrollTop = 0;
      // drop the promoted layers once nothing is moving
      setTimeout(() => root.classList.add('is-settled'), 1500);
    }, msVar('--t-exit', 2180));
  }

  function close(){
    if (state === 'closed') return;
    state = 'closed';
    root.classList.remove('is-open', 'is-opening', 'is-settled');
    seal.classList.remove('is-breaking');
    openBtn.focus({ preventScroll: true });
    scheduleFit();
  }

  openBtn.addEventListener('click', open);
  replay.addEventListener('click', close);

  document.addEventListener('keydown', e => {
    if (state !== 'closed') return;
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    if (document.activeElement === openBtn) return;   // let the button handle it
    e.preventDefault();
    open();
  });

  /* ==========================================================
     Fit now, and again once webfonts have changed the metrics
     ========================================================== */
  fitEnvelope();
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(scheduleFit);
  }
  window.addEventListener('load', scheduleFit, { once: true });

  /* gentle nudge if nobody clicks */
  setTimeout(() => {
    if (state !== 'closed') return;
    const s = hint.querySelector('span');
    if (!s) return;
    s.style.animation = 'none';
    s.style.transform = 'translateY(-5px)';
  }, 9000);
})();
</script>
</body>
</html>
